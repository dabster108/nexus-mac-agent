[project]
name = "nexus-backend"
version = "0.1.0"
description = "NEXUS agent runtime backend (FastAPI + LangGraph + MCP)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-core>=1.5.3",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.10",
    "mcp>=2.0.0",
    "mistralai>=2.9.2",
    "nexus-mac-mcp",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.uv.sources]
nexus-mac-mcp = { path = "../nexus-mac-mcp", editable = true }
